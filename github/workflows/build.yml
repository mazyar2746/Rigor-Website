```yaml
name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign APK with Your Key
        run: |
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          BT_VERSION=$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          ZIPALIGN="$ANDROID_HOME/build-tools/$BT_VERSION/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/$BT_VERSION/apksigner"
          
          $ZIPALIGN -v -p 4 $UNSIGNED_APK app-aligned.apk
          
          # ⚠️ اینجا متن طولانی خودت را جایگزین کن (بین علامت‌های "")
          echo "" | base64 -d > my-release-key.jks
          
          # ⚠️ اینجا رمزهای خودت را جایگزین کن
          $APKSIGNER sign --ks my-release-key.jks \
            --ks-pass pass:rigorhashemnasiri \
            --key-pass pass:رمز_کلید_شما \
            --ks-key-alias rigorhashemnasiri \
            --out app-release-signed.apk app-aligned.apk
            
          $APKSIGNER verify app-release-signed.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Rigor-Release-APK-Final
          path: app-release-signed.apk
          if-no-files-found: error