name: Fetch Iran Stock Market Data

on:
  push:
    branches:
      - feature/iran-stock-analyzer
  workflow_dispatch:  # اجرای دستی (برای تست)
  schedule:
    - cron:
  push:
    branches:
      - feature/iran-stock-analyzer '30 14 * * *'  # هر روز ساعت ۱۸:۰۰ به وقت تهران (۱۴:۳۰ UTC)

jobs:
  fetch-data:
    runs-on:
  push:
    branches:
      - feature/iran-stock-analyzer ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version:
  push:
    branches:
      - feature/iran-stock-analyzer '3.11'

      - name: Fetch market data
        run: python scripts/fetch_market_data.py

      - name: Commit and push data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add market_data.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update market data [skip ci]"
          git push
# Test trigger
