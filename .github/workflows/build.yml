name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign APK with Keystore
        env:
          KEYSTORE_PASSWORD: "rigornasirihashem"
          KEY_ALIAS: "my-key-alias"
          KEY_PASSWORD: "rigornasirihashem"
        run: |
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -n 1)
          if [ -z "$UNSIGNED_APK" ]; then
            echo "Error: Unsigned release APK not found!"
            exit 1
          fi
          echo "Found unsigned APK at: $UNSIGNED_APK"

          BT_VERSION=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          ZIPALIGN="$ANDROID_HOME/build-tools/$BT_VERSION/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/$BT_VERSION/apksigner"

          echo "Using Android Build-Tools version: $BT_VERSION"

          # 1. Align the unsigned APK
          "$ZIPALIGN" -v -p 4 "$UNSIGNED_APK" app-aligned.apk

          # 2. Ensure Keystore exists (use release.keystore from repo or create with keytool)
          if [ ! -f release.keystore ]; then
            echo "Generating release.keystore on runner..."
            keytool -genkeypair -v -keystore release.keystore \
              -storepass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keypass "$KEY_PASSWORD" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Rigor, OU=Rigor, O=Rigor, L=Tehran, C=IR"
          else
            echo "Using committed release.keystore from repository."
          fi

          # Verify keystore integrity with keytool
          keytool -list -keystore release.keystore -storepass "$KEYSTORE_PASSWORD" > /dev/null
          echo "Keystore successfully verified!"

          # 3. Sign the APK using apksigner
          "$APKSIGNER" sign --ks release.keystore \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --out app-release-signed.apk app-aligned.apk

          # 4. Verify signature
          "$APKSIGNER" verify --verbose app-release-signed.apk

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Rigor-Release-APK
          path: app-release-signed.apk
          if-no-files-found: error