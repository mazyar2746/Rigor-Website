name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configure Environment Variables (.env)
        run: |
          touch .env
          echo "# Injected from GitHub Secrets" >> .env
          if [ -n "${{ secrets.CMC_PRO_API_KEY }}" ]; then
            echo "CMC_PRO_API_KEY=${{ secrets.CMC_PRO_API_KEY }}" >> .env
          fi
          if [ -n "${{ secrets.BSCSCAN_API_KEY }}" ]; then
            echo "BSCSCAN_API_KEY=${{ secrets.BSCSCAN_API_KEY }}" >> .env
          fi

      - name: Prepare Debug Keystore
        run: |
          if [ -f "debug.keystore" ]; then
            echo "debug.keystore already exists."
          elif [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "Generating fresh debug keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Android Release & Debug APKs
        run: |
          # Prepare Release Signing Keystore
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Using custom release keystore from GitHub Secrets..."
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
            export KEYSTORE_PATH="$(pwd)/my-upload-key.jks"
            export STORE_PASSWORD="${{ secrets.RELEASE_STORE_PASSWORD }}"
            export KEY_PASSWORD="${{ secrets.RELEASE_KEY_PASSWORD }}"
          else
            echo "No custom release secret found. Generating automated release key for standalone APK release..."
            keytool -genkey -v -keystore my-upload-key.jks -storepass android -alias upload -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Rigor Release,O=Rigor,C=US"
            export KEYSTORE_PATH="$(pwd)/my-upload-key.jks"
            export STORE_PASSWORD="android"
            export KEY_PASSWORD="android"
          fi

          echo "Building Release APK..."
          ./gradlew assembleRelease --no-daemon --stacktrace

          echo "Building Debug APK..."
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Release APK (Production)
        uses: actions/upload-artifact@v4
        with:
          name: Rigor-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Debug APK (Development)
        uses: actions/upload-artifact@v4
        with:
          name: Rigor-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
